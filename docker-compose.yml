version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: carol_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-carolroot}
      MYSQL_DATABASE: ${DB_NAME:-carol}
      MYSQL_USER: ${DB_USER:-carol}
      MYSQL_PASSWORD: ${DB_PASSWORD:-carolpass}
    volumes:
      - carol_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-carolroot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: carol_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-carol}
      DB_USER: ${DB_USER:-carol}
      DB_PASSWORD: ${DB_PASSWORD:-carolpass}
      PORT: 8000
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coolify

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: carol_caddy
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.carol.entrypoints=web,websecure"
      - "traefik.http.routers.carol.tls.certresolver=letsencrypt"
      - "traefik.http.services.carol.loadbalancer.server.port=80"
      # Descomenta y ajusta tu dominio en Coolify:
      # - "traefik.http.routers.carol.rule=Host(`carol.tudominio.com`)"

volumes:
  carol_db_data:

networks:
  coolify:
    external: true
