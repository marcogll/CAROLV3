<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte CAROL — Resultado de Evaluación</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="icon" type="image/svg+xml" href="/soul23-favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
*{box-sizing:border-box;}

/* ── Catppuccin Latte (Light) ── */
:root,[data-theme="light"]{
  --ctp-rosewater:#dc8a78;--ctp-flamingo:#dd7878;--ctp-pink:#ea76cb;
  --ctp-mauve:#8839ef;--ctp-red:#d20f39;--ctp-maroon:#e64553;
  --ctp-peach:#fe640b;--ctp-yellow:#df8e1d;--ctp-green:#40a02b;
  --ctp-teal:#179299;--ctp-sky:#04a5e5;--ctp-sapphire:#209fb5;
  --ctp-blue:#1e66f5;--ctp-lavender:#7287fd;
  --ctp-text:#4c4f69;--ctp-subtext1:#5c5f77;--ctp-subtext0:#6c6f85;
  --ctp-overlay2:#7c7f93;--ctp-overlay1:#8c8fa1;--ctp-overlay0:#9ca0b0;
  --ctp-surface2:#acb0be;--ctp-surface1:#bcc0cc;--ctp-surface0:#ccd0da;
  --ctp-base:#eff1f5;--ctp-mantle:#e6e9ef;--ctp-crust:#dce0e8;
  --bg-page:var(--ctp-base);--bg-card:#fff;--bg-card-alt:var(--ctp-mantle);
  --text-primary:var(--ctp-text);--text-secondary:var(--ctp-subtext1);
  --text-muted:var(--ctp-subtext0);--border-color:var(--ctp-surface0);
  --border-light:var(--ctp-surface1);--shadow-color:rgba(0,0,0,.08);
}
/* ── Catppuccin Mocha (Dark) ── */
[data-theme="dark"]{
  --ctp-rosewater:#f5e0dc;--ctp-flamingo:#f2cdcd;--ctp-pink:#f5c2e7;
  --ctp-mauve:#cba6f7;--ctp-red:#f38ba8;--ctp-maroon:#eba0ac;
  --ctp-peach:#fab387;--ctp-yellow:#f9e2af;--ctp-green:#a6e3a1;
  --ctp-teal:#94e2d5;--ctp-sky:#89dceb;--ctp-sapphire:#74c7ec;
  --ctp-blue:#89b4fa;--ctp-lavender:#b4befe;
  --ctp-text:#cdd6f4;--ctp-subtext1:#bac2de;--ctp-subtext0:#a6adc8;
  --ctp-overlay2:#9399b2;--ctp-overlay1:#7f849c;--ctp-overlay0:#6c7086;
  --ctp-surface2:#585b70;--ctp-surface1:#45475a;--ctp-surface0:#313244;
  --ctp-base:#1e1e2e;--ctp-mantle:#181825;--ctp-crust:#11111b;
  --bg-page:var(--ctp-crust);--bg-card:var(--ctp-base);--bg-card-alt:var(--ctp-mantle);
  --text-primary:var(--ctp-text);--text-secondary:var(--ctp-subtext1);
  --text-muted:var(--ctp-subtext0);--border-color:var(--ctp-surface0);
  --border-light:var(--ctp-surface1);--shadow-color:rgba(0,0,0,.25);
}

body{margin:0;padding:0;background:var(--bg-page);font-family:'Inter',system-ui,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
.report{max-width:800px;margin:0 auto;background:var(--bg-card);}

/* Theme Toggle */
.rpt-theme-toggle{position:fixed;top:1rem;right:1rem;z-index:9999;background:var(--bg-card);border:1px solid var(--border-color);border-radius:99px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px var(--shadow-color);transition:all .2s;}
.rpt-theme-toggle:hover{box-shadow:0 4px 16px var(--shadow-color);transform:scale(1.08);}
.rpt-theme-toggle .material-symbols-rounded{font-size:20px;color:var(--text-primary);}

/* Header */
.rpt-header{background:linear-gradient(135deg,#0D1B2A 0%,#1B4F72 100%);padding:2rem 2.5rem;color:#fff;position:relative;overflow:hidden;}
.rpt-header::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(0,184,148,.12);}
.rpt-brand{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;}
.rpt-brand img{height:32px;}
.rpt-brand span{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;}
.rpt-brand span em{color:#00B894;font-style:normal;}
.rpt-header h1{margin:0;font-size:1.1rem;font-weight:600;color:#94a3b8;}

/* Body */
.rpt-body{padding:2rem 2.5rem;}
.sec-title{font-size:.95rem;font-weight:700;color:var(--text-primary);margin:0 0 1rem;padding-bottom:.5rem;border-bottom:2px solid var(--ctp-green);display:flex;align-items:center;gap:.5rem;}

/* Candidate card */
.cand-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 1.5rem;background:var(--bg-card-alt);border-radius:12px;padding:1.25rem;font-size:.82rem;margin-bottom:1.5rem;}
.cand-grid label{color:var(--text-muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:.1rem;}
.cand-grid strong{color:var(--text-primary);}

/* Score hero */
.score-hero{display:flex;align-items:center;gap:2rem;margin:1.5rem 0;flex-wrap:wrap;}
.donut-wrap{position:relative;width:140px;height:140px;flex-shrink:0;}
.donut-wrap canvas{width:140px!important;height:140px!important;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-pct{font-size:1.8rem;font-weight:800;color:var(--text-primary);}
.donut-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.score-kpis{flex:1;min-width:200px;display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.kpi-card{background:var(--bg-card-alt);border-radius:8px;padding:.65rem;text-align:center;}
.kpi-card span{display:block;font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}
.kpi-card b{font-size:1rem;color:var(--text-primary);}

/* Charts row */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin:1.5rem 0;}
.chart-box{background:var(--bg-card-alt);border-radius:12px;padding:1rem;text-align:center;}
.chart-box h4{margin:0 0 .5rem;font-size:.8rem;color:var(--text-muted);}

/* Category table */
.cat-table{width:100%;font-size:.8rem;margin-bottom:1.5rem;border-collapse:collapse;}
.cat-table th{background:#0D1B2A;color:#fff;padding:.55rem .6rem;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;}
.cat-table td{padding:.5rem .6rem;border-bottom:1px solid var(--border-light);}
.cat-table tr:nth-child(even){background:var(--bg-card-alt);}
.cat-bar-bg{width:100%;height:6px;background:var(--border-light);border-radius:99px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:99px;}

/* Strengths / Weaknesses */
.sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem;}
.sw-box{border-radius:10px;padding:1rem;font-size:.8rem;}
.sw-box.strength{background:rgba(0,184,148,.1);border:1px solid var(--ctp-green);}
.sw-box.weakness{background:rgba(220,38,38,.1);border:1px solid var(--ctp-red);}
.sw-box h4{margin:0 0 .5rem;font-size:.82rem;}
.sw-item{padding:.3rem 0;display:flex;justify-content:space-between;align-items:center;}
.sw-item .bar-sm{width:60px;height:5px;background:var(--border-light);border-radius:99px;overflow:hidden;display:inline-block;margin-left:.5rem;}
.sw-item .bar-sm-fill{height:100%;border-radius:99px;}

/* Remediation */
.remed-card{background:rgba(223,142,29,.1);border:1px solid var(--ctp-yellow);border-radius:10px;padding:1rem;margin-bottom:.75rem;}
.remed-card h4{margin:0 0 .3rem;font-size:.82rem;color:var(--ctp-peach);}
.remed-card p{margin:0;font-size:.78rem;color:var(--ctp-peach);line-height:1.5;}
.remed-badge{display:inline-block;padding:.15rem .45rem;border-radius:4px;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-right:.5rem;}
.remed-badge.critical{background:rgba(220,38,38,.15);color:var(--ctp-red);}
.remed-badge.improve{background:rgba(30,102,245,.15);color:var(--ctp-blue);}

/* Wrong questions */
.wrong-item{padding:.75rem 0;border-bottom:1px solid var(--border-light);}
.wrong-item:last-child{border:none;}
.wrong-meta{display:flex;gap:.4rem;margin-bottom:.3rem;flex-wrap:wrap;}
.wrong-meta span{font-size:.65rem;font-weight:600;padding:.12rem .4rem;border-radius:99px;background:var(--bg-card-alt);color:var(--text-muted);}
.wrong-q{font-size:.82rem;font-weight:600;color:var(--text-primary);line-height:1.4;margin-bottom:.3rem;}
.wrong-opt{font-size:.75rem;padding:.2rem .4rem;border-radius:6px;display:inline-block;margin:.1rem .2rem 0 0;}
.wrong-opt.chosen{background:rgba(220,38,38,.15);color:var(--ctp-red);}
.wrong-hint{font-size:.75rem;color:var(--ctp-peach);background:rgba(223,142,29,.1);border:1px solid var(--ctp-yellow);border-radius:6px;padding:.4rem .6rem;margin-top:.4rem;}

/* Footer */
.rpt-footer{background:var(--bg-card-alt);padding:1rem 2.5rem;text-align:center;font-size:.72rem;color:var(--text-muted);border-top:1px solid var(--border-color);}
.rpt-footer a{color:var(--ctp-blue);text-decoration:none;}

/* Full-width chart */
.chart-full{background:var(--bg-card-alt);border-radius:12px;padding:1rem;margin:1.5rem 0;}
.chart-full h4{margin:0 0 .5rem;font-size:.8rem;color:var(--text-muted);text-align:center;}

@media print{body{background:var(--bg-page);}.report{box-shadow:none;}.rpt-theme-toggle{display:none!important;}}
@media(max-width:640px){.charts-row,.sw-grid{grid-template-columns:1fr;}.rpt-body{padding:1.5rem;}.cand-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<button class="rpt-theme-toggle" onclick="toggleReportTheme()" aria-label="Cambiar tema">
  <span class="material-symbols-rounded" id="rpt-theme-icon">dark_mode</span>
</button>

<div class="report" id="report-root">
  <div style="text-align:center;padding:4rem;color:var(--text-muted);font-size:.9rem;">Cargando reporte…</div>
</div>

<script>
const API='';
function getToken(){return localStorage.getItem('carol_admin_token');}

// Global fallback: if report doesn't render in 6 seconds, show error
setTimeout(()=>{
  const root=document.getElementById('report-root');
  if(root && root.innerHTML.includes('Cargando reporte')){
    root.innerHTML='<div style="padding:3rem;text-align:center;color:#dc2626;"><h3>⚠️ Error cargando reporte</h3><p style="font-size:.85rem;">El reporte no pudo generarse. Revisa la consola (F12) para detalles.</p><p style="font-size:.8rem;color:var(--text-muted);margin-top:1rem;">Datos embebidos: '+(window.__REPORT_DATA__?'Sí':'No')+'<br>Chart.js: '+(typeof Chart)+'</p></div>';
  }
},6000);

async function loadReport(){
  const root=document.getElementById('report-root');
  console.log('[CAROL Report] loadReport called');

  // Check for embedded data first (from /api/report/{id}/view)
  if(window.__REPORT_DATA__){
    console.log('[CAROL Report] Using embedded data');
    try{
      render(window.__REPORT_DATA__);
    }catch(e){
      console.error('[CAROL Report] Render error:',e);
      root.innerHTML='<div style="padding:3rem;text-align:center;color:#dc2626;"><h3>Error al renderizar</h3><p>'+e.message+'</p><pre style="font-size:.7rem;text-align:left;background:rgba(0,0,0,.05);padding:1rem;border-radius:6px;margin-top:1rem;overflow:auto;">'+e.stack+'</pre></div>';
    }
    return;
  }

  // Fallback: fetch from API
  console.log('[CAROL Report] No embedded data, fetching from API...');
  const params=new URLSearchParams(location.search);
  let id=params.get('id');
  if(!id){
    const m=location.pathname.match(/\/api\/report\/([^/]+)\/view/);
    if(m)id=m[1];
  }
  if(!id){root.innerHTML='<div style="padding:3rem;text-align:center;color:#dc2626;">Falta el parámetro ?id=</div>';return;}
  try{
    const r=await fetch(API+'/api/result/'+id,{headers:{'Authorization':'Bearer '+getToken()}});
    const data=await r.json();
    if(data.error){root.innerHTML='<div style="padding:3rem;text-align:center;color:#dc2626;">'+data.error+'</div>';return;}
    render(data);
  }catch(e){
    console.error('[CAROL Report] Fetch error:',e);
    root.innerHTML='<div style="padding:3rem;text-align:center;color:#dc2626;">Error cargando reporte. Inicia sesión en el admin primero.</div>';
  }
}

function render(data){
  try{
  const c=data.candidate||{};
  const a=data.assessment||{};
  const res=data.results||{};
  let catBd=data.category_breakdown||{};
  const answers=data.answers||{};
  let wrongIds=data.wrong_question_ids||[];
  const pct=res.pct_score||0;
  const passed=res.passed||(pct>=70);

  // Derive missing fields
  const totalQ=res.total||Object.keys(answers).length;
  const totalCorrect=res.correct_answers||res.score||0;
  const earnedPts=res.earned_pts||(totalCorrect*(res.points_per_question||10));
  const maxPts=res.max_pts||(totalQ*(res.points_per_question||10));
  const timeSec=res.time_seconds||0;

  // Fallback: derive wrong_question_ids from answers if empty
  if(!wrongIds.length && Object.keys(answers).length){
    wrongIds=Object.entries(answers).filter(([k,v])=>v.correct===false||v.correct===0).map(([k])=>k);
  }

  // If category_breakdown is empty, build from results.categories_results
  if(!Object.keys(catBd).length && res.categories_results){
    const tmp={};
    Object.entries(res.categories_results).forEach(([k,v])=>{
      tmp[k]={correct:v.correct||0,total:v.total||0,pct:v.pct||v.pct_score||0};
    });
    catBd=tmp;
  }
  // If still empty or all pcts are 0, build from answers (most reliable fallback)
  const needsFallback=!Object.keys(catBd).length || Object.values(catBd).every(v=>!v.pct);
  if(needsFallback && Object.keys(answers).length){
    const tmp={};
    Object.entries(answers).forEach(([k,v])=>{
      const cat=v.category||'General';
      if(!tmp[cat])tmp[cat]={correct:0,total:0,pct:0};
      tmp[cat].total++;
      if(v.correct)tmp[cat].correct++;
    });
    Object.values(tmp).forEach(t=>{t.pct=Math.round(t.correct/t.total*100);});
    catBd=tmp;
  }

  // Build category data
  const cats=Object.keys(catBd);
  const catPcts=cats.map(k=>catBd[k].pct||0);
  const catCorrect=cats.map(k=>catBd[k].correct||0);
  const catTotal=cats.map(k=>catBd[k].total||0);

  // Strengths (>70%) and Weaknesses (<70%)
  const strengths=cats.filter(k=>(catBd[k].pct||0)>=70).sort((a,b)=>(catBd[b].pct||0)-(catBd[a].pct||0));
  const weaknesses=cats.filter(k=>(catBd[k].pct||0)<70).sort((a,b)=>(catBd[a].pct||0)-(catBd[b].pct||0));

  // Radar: candidate vs minimum (55%) vs ideal (85%)
  const radarMin=cats.map(()=>55);
  const radarIdeal=cats.map(()=>85);

  // Remediation strategies per weak area
  const remediations={
    'Seguridad Industrial':'Implementar programa de inducción obligatorio con simulacros mensuales. Crear checklist de EPP y zona de seguridad revisado por shift lead.',
    'Terminología Técnica':'Diccionario visual de términos técnicos de moldeo distribuido en planta. Sesiones semanales de 15 min de refuerzo.',
    'Procesos de Moldeo':'Capacitación práctica en máquina real: parámetros de tiempo, presión, temperatura. Manual de Setup por molde.',
    'Control de Calidad':'Estación de inspección con boundary samples visuales. Ejercicio práctico de medición con instrumentos calibrados.',
    'Materiales y Resinas':'Fichas técnicas de resinas utilizadas en planta. Curso de secado y manejo de material. Práctica de identificación.',
    'Parámetros de Proceso':'Mapa de parámetros por molde/producto. Tabla de rangos aceptables. Monitoreo en tiempo real con alerts.',
    'Herramienta de Moldeo':'Capacitación en mantenimiento preventivo de moldes. Checklist de salida y entrada de herramienta.',
    'Optimización':'Programa de kaizen enfocado en ciclos de moldeo. Reducción de scrap con DMAIC básico.',
    'Ingeniería de Procesos':'Curso avanzado de DOE para optimización de procesos. Proyecto piloto de reducción de tiempos muertos.',
    'Resolución de Problemas':'Metodología 8D o A3 aplicada a problemas recurrentes. Árbol de causas y brainstorming estructurado.',
    'Diseño de Moldes':'Sesiones con el equipo de diseño. Revisión de planos de molde y cooling channels. Simulación básica.',
    'Normatividad':'Directorio de normas aplicables (ISO, ASTM). Auditoría interna semestral. Checklist de cumplimiento por estación.',
  };

  // Average KPI
  const avgScore=catPcts.length?Math.round(catPcts.reduce((a,b)=>a+b,0)/catPcts.length):0;

  const html=`
  <!-- HEADER -->
  <div class="rpt-header">
    <div class="rpt-brand">
      <a href="https://soul23.mx" target="_blank" style="text-decoration:none;"><img src="/soul23-logo.svg" alt="Soul23"></a>
      <span>CAROL <em>.</em></span>
    </div>
    <h1>Reporte de Evaluación Técnica — Moldeo por Inyección de Plásticos</h1>
  </div>

  <div class="rpt-body">

  <!-- CANDIDATE INFO -->
  <div class="sec-title">👤 Información del Candidato</div>
  <div class="cand-grid">
    <div><label>Nombre</label><strong>${c.full_name||'—'}</strong></div>
    <div><label>ID Empleado</label><strong>${c.employee_id||'—'}</strong></div>
    <div><label>Empresa</label><strong>${c.company_name||'—'}</strong></div>
    <div><label>Departamento</label><strong>${c.department||'—'}</strong></div>
    <div><label>Puesto</label><strong>${c.job_role||'—'}</strong></div>
    <div><label>Experiencia</label><strong>${c.years_experience||'—'} años</strong></div>
    <div><label>Nivel Evaluado</label><strong>${a.level_name||(a.level==='basic'?'Básico':a.level==='medium'?'Intermedio':a.level==='advanced'?'Avanzado':a.level||'—')}</strong></div>
    <div><label>Fecha</label><strong>${fmtDate(data.submitted_at)}</strong></div>
  </div>

  <!-- SCORE HERO -->
  <div class="score-hero">
    <div class="donut-wrap">
      <canvas id="donutChart"></canvas>
      <div class="donut-center">
        <div class="donut-pct">${pct}%</div>
        <div class="donut-label" style="color:${passed?'var(--ctp-green)':'var(--ctp-red)'};">${passed?'✓ APROBADO':'✗ NO APROBÓ'}</div>
      </div>
    </div>
    <div class="score-kpis">
      <div class="kpi-card"><span>Promedio General</span><b>${avgScore}%</b></div>
      <div class="kpi-card"><span>Correctas</span><b>${totalCorrect}/${totalQ}</b></div>
      <div class="kpi-card"><span>Puntos</span><b>${earnedPts.toFixed(1)}/${maxPts.toFixed(1)}</b></div>
      <div class="kpi-card"><span>Tiempo</span><b>${fmtTime(timeSec)}</b></div>
      <div class="kpi-card"><span>Áreas Evaluadas</span><b>${cats.length}</b></div>
      <div class="kpi-card"><span>Áreas Débiles</span><b style="color:${weaknesses.length?'var(--ctp-red)':'var(--ctp-green)'};">${weaknesses.length}</b></div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="charts-row">
    <div class="chart-box">
      <h4>📡 Distribución por Área (Radar)</h4>
      <canvas id="radarChart" height="260"></canvas>
    </div>
    <div class="chart-box">
      <h4>📊 Desempeño por Área (Barras)</h4>
      <canvas id="barChart" height="260"></canvas>
    </div>
  </div>

  <!-- REACTIVES STACKED BAR -->
  <div class="sec-title">📝 Reactivos por Categoría</div>
  <div class="chart-box" style="margin:0 0 1.5rem;">
    <canvas id="reactivesChart" height="220"></canvas>
  </div>

  <!-- POLAR AREA CHART -->
  <div class="sec-title">🌐 Desempeño por Área de Evaluación</div>
  <div class="chart-box" style="max-width:420px;margin:0 auto 1.5rem;">
    <canvas id="polarChart" height="320"></canvas>
  </div>

  <!-- CATEGORY TABLE -->
  <div class="sec-title">📋 Desempeño por Área de Conocimiento</div>
  <table class="cat-table">
    <thead><tr><th>Área</th><th>Correctas</th><th>%</th><th>Progreso</th></tr></thead>
    <tbody>${cats.map((cat,i)=>{
      const p=catPcts[i];
      const col=p>=85?'var(--ctp-green)':p>=70?'var(--ctp-teal)':p>=55?'var(--ctp-peach)':'var(--ctp-red)';
      return `<tr><td><b>${cat}</b></td><td>${catCorrect[i]}/${catTotal[i]}</td><td style="font-weight:700;color:${col};">${p}%</td><td style="width:140px;"><div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${p}%;background:${col};"></div></div></td></tr>`;
    }).join('')}</tbody>
  </table>

  <!-- STRENGTHS & WEAKNESSES -->
  <div class="sw-grid">
    <div class="sw-box strength">
      <h4 style="color:var(--ctp-green);">💪 Fortalezas</h4>
      ${strengths.length?strengths.map(k=>{
        const p=catBd[k].pct||0;
        return `<div class="sw-item"><span><b>${k}</b> ${p}%</span><span class="bar-sm"><span class="bar-sm-fill" style="width:${p}%;background:var(--ctp-green);"></span></span></div>`;
      }).join(''):'<div style="color:var(--text-muted);">Sin áreas destacadas (todas < 70%)</div>'}
    </div>
    <div class="sw-box weakness">
      <h4 style="color:var(--ctp-red);">⚠️ Áreas Débiles</h4>
      ${weaknesses.length?weaknesses.map(k=>{
        const p=catBd[k].pct||0;
        return `<div class="sw-item"><span><b>${k}</b> ${p}%</span><span class="bar-sm"><span class="bar-sm-fill" style="width:${p}%;background:var(--ctp-red);"></span></span></div>`;
      }).join(''):'<div style="color:var(--ctp-green);">Todas las áreas superan 70%</div>'}
    </div>
  </div>

  <!-- REMEDIATION -->
  ${weaknesses.length?`
  <div class="sec-title">🎯 Estrategia de Remediación</div>
  ${weaknesses.map(k=>{
    const p=catBd[k].pct||0;
    const isCrit=p<55;
    const strategy=remediations[k]||`Refuerzo en ${k}: revisar material de estudio, realizar práctica guiada y evaluación de seguimiento en 2 semanas.`;
    return `<div class="remed-card">
      <h4><span class="remed-badge ${isCrit?'critical':'improve'}">${isCrit?'Crítico':'Mejora'}</span>${k} — ${p}%</h4>
      <p>${strategy}</p>
    </div>`;
  }).join('')}`:''}

  <!-- WRONG QUESTIONS -->
  ${wrongIds.length?`
  <div class="sec-title">❌ Preguntas Incorrectas — Revisión</div>
  ${wrongIds.map(qid=>{
    const ans=answers[qid];
    if(!ans)return '';
    const letters=['A','B','C','D'];
    const chosen=ans.chosen_index!==undefined?letters[ans.chosen_index]+'. '+(ans.options?ans.options[ans.chosen_index]:'—'):'Sin respuesta';
    return `<div class="wrong-item">
      <div class="wrong-meta"><span>${ans.category||'—'}</span><span>${ans.type||''}</span><span>${ans.score||0} pts</span></div>
      <div class="wrong-q">${ans.question||qid}</div>
      <div class="wrong-opt chosen"><b>Tu respuesta:</b> ${chosen}</div>
      <div class="wrong-hint">📚 Revisa el material de estudio de <b>${ans.category||'esta área'}</b> para reforzar este tema.</div>
    </div>`;
  }).join('')}`:'<div class="sec-title">✅ Preguntas Incorrectas</div><div style="color:var(--ctp-green);font-weight:700;">Sin preguntas incorrectas — excelente desempeño.</div>'}

  </div>

  <!-- FOOTER -->
  <div class="rpt-footer">
    <a href="https://soul23.mx" target="_blank" style="text-decoration:none;"><img src="/soul23-logo.svg" alt="Soul23" style="height:16px;opacity:.5;margin-bottom:.25rem;display:block;margin-left:auto;margin-right:auto;"></a><br>
    Reporte generado por <b>CAROL Assessment System</b> · <a href="${location.origin}">${location.host}</a><br>
    <small>Confidencial · Uso interno autorizado</small>
  </div>`;

  document.getElementById('report-root').innerHTML=html;
  document.title='Reporte CAROL — '+c.full_name;

  // Draw charts
  setTimeout(()=>{
    if(typeof Chart==='undefined'){console.error('Chart.js not loaded');return;}
    try{
      // Donut
      const donutCtx=document.getElementById('donutChart');
      if(donutCtx) new Chart(donutCtx,{
        type:'doughnut',
        data:{datasets:[{data:[pct,100-pct],backgroundColor:[passed?'#00B894':'#E74C3C','#e2e8f0'],borderWidth:0}]},
        options:{cutout:'72%',responsive:false,plugins:{legend:{display:false},tooltip:{enabled:false}},animation:{animateRotate:true}}
      });

      // Radar
      const radarCtx=document.getElementById('radarChart');
      if(radarCtx && cats.length) new Chart(radarCtx,{
        type:'radar',
        data:{
          labels:cats.map(c=>c.length>16?c.substring(0,14)+'…':c),
          datasets:[
            {label:'Candidato',data:catPcts,backgroundColor:'rgba(0,184,148,.2)',borderColor:'#00B894',borderWidth:2,pointBackgroundColor:'#00B894',pointRadius:4},
            {label:'Mínimo (55%)',data:radarMin,backgroundColor:'rgba(231,76,60,.08)',borderColor:'#E74C3C',borderWidth:1,borderDash:[4,4],pointRadius:0},
            {label:'Ideal (85%)',data:radarIdeal,backgroundColor:'rgba(39,174,96,.08)',borderColor:'#27AE60',borderWidth:1,borderDash:[4,4],pointRadius:0}
          ]
        },
        options:{scales:{r:{min:0,max:100,ticks:{stepSize:20,font:{size:10}},pointLabels:{font:{size:10}}}},plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:12}}}}
      });

      // Bar chart
      const barCtx=document.getElementById('barChart');
      if(barCtx && cats.length) new Chart(barCtx,{
        type:'bar',
        data:{
          labels:cats.map(c=>c.length>12?c.substring(0,10)+'…':c),
          datasets:[
            {label:'Candidato',data:catPcts,backgroundColor:catPcts.map(p=>p>=85?'#00B894':p>=70?'#27AE60':p>=55?'#E67E22':'#E74C3C'),borderRadius:4},
          ]
        },
        options:{indexAxis:'y',scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%'}}},plugins:{legend:{display:false}}}
      });

      // Polar Area chart
      const polarCtx=document.getElementById('polarChart');
      if(polarCtx && cats.length) new Chart(polarCtx,{
        type:'polarArea',
        data:{
          labels:cats,
          datasets:[{
            data:catPcts,
            backgroundColor:catPcts.map(p=>p>=85?'rgba(0,184,148,.7)':p>=70?'rgba(39,174,96,.7)':p>=55?'rgba(230,126,34,.7)':'rgba(231,76,60,.7)'),
            borderColor:catPcts.map(p=>p>=85?'#00B894':p>=70?'#27AE60':p>=55?'#E67E22':'#E74C3C'),
            borderWidth:2
          }]
        },
        options:{scales:{r:{min:0,max:100,ticks:{stepSize:20,backdropColor:'transparent',font:{size:10}},grid:{color:'#e2e8f0'}}},plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:14,padding:12}},tooltip:{callbacks:{label:ctx=>ctx.label+': '+ctx.raw+'%'}}}}
      });

      // Reactives stacked bar (correct vs incorrect per category)
      const reactCtx=document.getElementById('reactivesChart');
      if(reactCtx && cats.length){
        const catIncorrect=cats.map((k,i)=>(catTotal[i]||0)-(catCorrect[i]||0));
        new Chart(reactCtx,{
          type:'bar',
          data:{
            labels:cats.map(c=>c.length>18?c.substring(0,16)+'…':c),
            datasets:[
              {label:'Correctas',data:catCorrect,backgroundColor:'rgba(0,184,148,.8)',borderRadius:4},
              {label:'Incorrectas',data:catIncorrect,backgroundColor:'rgba(231,76,60,.7)',borderRadius:4}
            ]
          },
          options:{indexAxis:'y',scales:{x:{stacked:true,grid:{color:'rgba(0,0,0,.06)'},ticks:{stepSize:1}},y:{stacked:true,grid:{display:false}}},plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:14,padding:12}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.raw+' reactivos'}}}}
        );
      }
    }catch(e){console.error('Chart error:',e);}
  },300);
  }catch(err){
    console.error('Render error:',err);
    document.getElementById('report-root').innerHTML='<div style="padding:3rem;text-align:center;color:#dc2626;"><h3>Error al generar el reporte</h3><p style="font-size:.85rem;color:var(--text-muted);">'+err.message+'</p><p style="font-size:.8rem;margin-top:1rem;">Revisa la consola (F12) para más detalles.</p></div>';
  }
}

function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('es-MX',{year:'numeric',month:'long',day:'numeric'});}
function fmtTime(sec){const m=Math.floor(sec/60);const s=sec%60;return m+'m '+s+'s';}

document.addEventListener('DOMContentLoaded',loadReport);

// Theme toggle
function initReportTheme(){
  const saved=localStorage.getItem('carol_theme');
  const prefersDark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  const theme=saved||(prefersDark?'dark':'light');
  applyReportTheme(theme);
}
function applyReportTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  const icon=document.getElementById('rpt-theme-icon');
  if(icon)icon.textContent=theme==='dark'?'light_mode':'dark_mode';
  localStorage.setItem('carol_theme',theme);
}
function toggleReportTheme(){
  const current=document.documentElement.getAttribute('data-theme');
  applyReportTheme(current==='dark'?'light':'dark');
}
initReportTheme();
</script>
